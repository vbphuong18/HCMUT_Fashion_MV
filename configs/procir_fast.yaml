# Deadline-scale ProCIR run (one GPU 24 GB, ~one night): MT+Align on all three FashionMV sources.
# train_fraction is set after the 30-step pilot so that the run fits the time left:
#   steps ~= 0.95 * 188015 * train_fraction / 64 ; hours ~= steps * sec_per_step / 3600
# Variants on the same data: --set multi_turn=false align=false (single-turn baseline) | cot=true
base_model: Qwen/Qwen3.5-0.8B
data_dir: data/FashionMV_hf/data/data
image_root: data/images_official_hr
output_dir: runs/fast_mt_align_s42
datasets: [deepfashion, f200k, fashiongen_train]
train_fraction: 0.10
dev_product_fraction: 0.05
max_views: 3
image_max_pixels: 112896
multi_turn: true
align: true
cot: false
batch_size: 64
chunk_size: 8
lr: 1.0e-4
seed: 42
eval_every: 100
save_every: 50
save_every_minutes: 15   # server may be reclaimed: lose at most ~15 min
dev_eval_max_queries: 500
